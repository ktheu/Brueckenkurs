      ## 1: Algorithmen mit Anweisung, Bedingung, Schleife und Verzweigung implementieren

      ### Aufgabe 1.1 (3 Punkte)

      Schreibe ein Python-Programm, das in den Variablen `a` und `b` zwei Zahlen speichert

      ## 6: Fehlerarten (Compiler-/Laufzeitfehler, syntaktisch/semantisch) unterscheiden

      ### Aufgabe 6.1 (2 Punkte)

      Ordne die folgenden drei Fehler jeweils der Kategorie
      `Compilerfehler/Laufzeitfehler`
      und `syntaktisch/semantisch` zu:

      ```python
      (a) print("Hallo"
      (b) zahl = 10 / 0
      (c) durchschnitt = summe * anzahl   # sollte / statt * sein
      ```

      <details>
      <summary>Lösung anzeigen</summary>

      ```python
      (a) fehlende Klammer: Compilerfehler, syntaktisch
      (b) Division durch 0: Laufzeitfehler, semantisch
          (Programm läuft, stürzt aber zur Laufzeit ab)
      (c) falscher Operator: Laufzeitfehler, semantisch
          (Programm läuft fehlerfrei durch, liefert aber falsches Ergebnis)
      ```

      </details>

      ### Aufgabe 6.2 (3 Punkte)

      Der folgende Code enthält einen syntaktischen Fehler. Finde und korrigiere ihn.

      ```python
      for i in range(10)
          print(i)
      ```

      <details>
      <summary>Lösung anzeigen</summary>

      ```python
      for i in range(10):
          print(i)

      # Fehler: Der Doppelpunkt am Ende der for-Zeile fehlte.
      ```

      </details>

      ### Aufgabe 6.3 (3 Punkte)

      Erkläre anhand eines eigenen Python-Beispiels den Unterschied zwischen einem syntaktischen
      und einem semantischen Fehler.

      <details>
      <summary>Lösung anzeigen</summary>

      ```python
      Syntaktischer Fehler (Verstoß gegen die Grammatik der Sprache):
      x = 5
      if x > 3
          print("groß")
      # Fehlender Doppelpunkt -> Programm startet gar nicht.

      Semantischer Fehler (Programm läuft, tut aber inhaltlich das Falsche):
      grundpreis = 100
      rabatt = 0.2
      endpreis = grundpreis + rabatt * grundpreis
      # Sollte "-" statt "+" sein, Programm läuft fehlerfrei,
      # liefert aber ein falsches Ergebnis.
      ```

      </details>

      ### Aufgabe 8.2 (3 Punkte)

      Erweitere die folgende Funktion so, dass sie zusätzlich zur Summe auch den Durchschnitt
      der Liste `zahlen` zurückgibt (als Tupel).

      ```python
      def summe_liste(zahlen):
          s = 0
          for z in zahlen:
              s = s + z
          return s
      ```

      <details>
      <summary>Lösung anzeigen</summary>

      ```python
      def summe_liste(zahlen):
          s = 0
          for z in zahlen:
              s = s + z
          durchschnitt = s / len(zahlen)
          return s, durchschnitt

      summe, mittel = summe_liste([2, 4, 6, 8])
      print(summe, mittel)
      ```

      </details>

      a = [5, 2, 9, 1, 6]
